plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def coreSourceRoot = layout.projectDirectory.dir('src/main/java/dev/rayportal/core')
def forbiddenCoreImportPrefixes = [
    'net.minecraft.',
    'net.neoforged.',
    'java.io.',
    'java.net.',
    'java.nio.channels.',
    'java.nio.file.',
    'java.awt.',
    'javax.swing.',
    'org.lwjgl.',
    'imgui.'
]

tasks.register('checkCoreBoundaries') {
    group = 'verification'
    description = 'Checks that core sources do not import platform, GUI, IO, or Cycles types.'
    inputs.dir(coreSourceRoot)

    doLast {
        def sourceRoot = coreSourceRoot.asFile
        if (!sourceRoot.exists()) {
            logger.lifecycle('No core source directory exists; boundary check has nothing to inspect.')
            return
        }

        def violations = []
        fileTree(sourceRoot).matching { include '**/*.java' }.files
                .sort { left, right -> project.relativePath(left) <=> project.relativePath(right) }
                .each { sourceFile ->
                    sourceFile.eachLine { line, lineNumber ->
                        def trimmed = line.trim()
                        if (trimmed.startsWith('import ')) {
                            def importedType = trimmed
                                    .substring('import '.length())
                                    .replaceFirst('^static\\s+', '')
                                    .replaceFirst(';\\s*$', '')
                            def lowerImportedType = importedType.toLowerCase(Locale.ROOT)
                            def forbiddenPrefix = forbiddenCoreImportPrefixes.find {
                                importedType.startsWith(it)
                            }

                            if (forbiddenPrefix != null || lowerImportedType.contains('cycles')) {
                                violations << "${project.relativePath(sourceFile)}:${lineNumber} imports '${importedType}'"
                            }
                        }
                    }
                }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    'core.* boundary violations found:\n- ' + violations.join('\n- ')
            )
        }

        logger.lifecycle('core.* boundary check passed.')
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkCoreBoundaries')
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : "[${neo_version},)",
            loader_version_range   : "[${neo_version},)",
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'Local'
            url = layout.buildDirectory.dir('repos/baseline').get().asFile.toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
